# 自动部署到华为云服务器
# 触发：推送 main 分支，或手动点 Run workflow
#
# 需要在 GitHub 仓库 Settings -> Secrets and variables -> Actions 里配置以下密钥：
#   SERVER_HOST     服务器公网 IP，例如 1.2.3.4
#   SERVER_PORT     SSH 端口（默认 22，secret 可不填）
#   SERVER_USER     SSH 用户名（默认 root，secret 可不填）
#   REMOTE_TARGET   服务器上网站根目录，例如 /www/wwwroot/resc.cn
#
# 私钥在 .github/deploy_key.b64（base64 编码），已加入 .gitignore，仅限 CI 使用

name: Deploy to Server

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建网站
        run: node node_modules/vitepress/bin/vitepress.js build

      - name: 上传网站到服务器
        run: |
          mkdir -p ~/.ssh
          # 从文件读取 base64 私钥，解码为原始文件
          base64 -d .github/deploy_key.b64 > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "key bytes: $(wc -c < ~/.ssh/deploy_key)"
          echo "key type: $(ssh-keygen -l -f ~/.ssh/deploy_key 2>&1 | awk '{print $NF}')"
          PUB=$(ssh-keygen -y -f ~/.ssh/deploy_key 2>&1)
          echo "pub key: $PUB"
          FPRINT=$(ssh-keygen -lf ~/.ssh/deploy_key 2>&1 | awk '{print $2}')
          echo "fingerprint: $FPRINT"

          SERVER_HOST='${{ secrets.SERVER_HOST }}'
          SERVER_PORT='${{ secrets.SERVER_PORT }}'
          SERVER_USER='${{ secrets.SERVER_USER }}'
          REMOTE_TARGET='${{ secrets.REMOTE_TARGET }}'
          PORT="${SERVER_PORT:-22}"
          USER="${SERVER_USER:-root}"
          echo "Deploying to $USER@$SERVER_HOST:$PORT -> $REMOTE_TARGET"

          # SSH 测试
          ssh -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -i ~/.ssh/deploy_key \
            -p "$PORT" \
            "$USER@$SERVER_HOST" \
            "echo 'SSH OK'; ls $REMOTE_TARGET/index.html"

          # rsync 同步
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=no -o BatchMode=yes" \
            .vitepress/dist/ \
            "$USER@$SERVER_HOST:$REMOTE_TARGET"
