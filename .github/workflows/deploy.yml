# 自动部署到华为云服务器
# 触发：推送 main 分支，或手动点 Run workflow
#
# 需要在 GitHub 仓库 Settings -> Secrets and variables -> Actions 里配置以下密钥：
#   SERVER_HOST     服务器公网 IP，例如 1.2.3.4
#   SERVER_PORT     SSH 端口，一般是 22
#   SERVER_USER     SSH 登录用户名，例如 root
#   SSH_PRIVATE_KEY SSH 私钥内容（用 ssh-keygen 生成 ed25519，把公钥放到服务器，私钥填这里）
#   REMOTE_TARGET   服务器上网站根目录，例如 /www/wwwroot/resc.cn
#
# 工作流程：拉代码 -> 装依赖 -> 构建 -> rsync 同步到服务器

name: Deploy to Server

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建网站
        run: node node_modules/vitepress/bin/vitepress.js build

      - name: 上传网站到服务器
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          REMOTE_TARGET: ${{ secrets.REMOTE_TARGET }}
        run: |
          mkdir -p ~/.ssh
          # 写入私钥，去除所有 \r
          printf '%s' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 调试：确认文件写入成功
          head -1 ~/.ssh/deploy_key
          wc -l ~/.ssh/deploy_key
          # SSH 诊断
          ssh -vv \
            -i ~/.ssh/deploy_key \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$SERVER_USER@$SERVER_HOST" \
            "echo connected; hostname; ls /www/wwwroot/resc.cn/index.html"
          # rsync 同步
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o StrictHostKeyChecking=no -o BatchMode=yes" \
            .vitepress/dist/ \
            "$SERVER_USER@$SERVER_HOST:$REMOTE_TARGET"
